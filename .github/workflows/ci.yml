name: CI/CD

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: backend/go.sum
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Vulnerability scan (informational)
        uses: golang/govulncheck-action@v1
        continue-on-error: true
        with:
          go-version-input: '1.25.x'
          go-package: './...'
          work-dir: backend
          repo-checkout: false
          cache: false

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  compose:
    name: Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Provide non-production config for validation
        shell: bash
        run: |
          cp backend/.env.test.example backend/.env.test
          cp backend/.env.prod.example backend/.env.prod
      - name: Validate development Compose
        run: docker compose -f deploy/docker-compose.dev.yml config
      - name: Validate production Compose
        run: docker compose --env-file backend/.env.prod -f deploy/docker-compose.yml config

  deploy-test:
    name: Deploy test environment
    needs: [backend, frontend, compose]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' && vars.DEPLOY_ENABLED == 'true' }}
    environment: test
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
    steps:
      - name: Install SSH key
        shell: bash
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/deploy_key"
          chmod 600 "$RUNNER_TEMP/deploy_key"
          ssh-keyscan -p "${DEPLOY_PORT:-22}" -H "$DEPLOY_HOST" >> "$RUNNER_TEMP/known_hosts"
      - name: Pull, rebuild and smoke test
        shell: bash
        run: |
          ssh -i "$RUNNER_TEMP/deploy_key" \
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /home/ubuntu/cs-qa-platform-test
          git fetch origin develop
          git checkout develop
          git pull --ff-only origin develop
          test -f backend/.env.test
          docker compose --env-file backend/.env.test -f deploy/docker-compose.test.yml config >/dev/null
          docker compose --env-file backend/.env.test -f deploy/docker-compose.test.yml build frontend backend
          docker compose --env-file backend/.env.test -f deploy/docker-compose.test.yml up -d --remove-orphans
          curl --fail --retry 10 --retry-delay 3 http://127.0.0.1:8081/api/v1/health
          curl --fail --retry 10 --retry-delay 3 http://127.0.0.1:8081/api/v1/ready
          REMOTE

  deploy-prod:
    name: Deploy production environment
    needs: [backend, frontend, compose]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true' }}
    environment: production
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
    steps:
      - name: Install SSH key
        shell: bash
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/deploy_key"
          chmod 600 "$RUNNER_TEMP/deploy_key"
          ssh-keyscan -p "${DEPLOY_PORT:-22}" -H "$DEPLOY_HOST" >> "$RUNNER_TEMP/known_hosts"
      - name: Pull, rebuild and smoke test
        shell: bash
        run: |
          ssh -i "$RUNNER_TEMP/deploy_key" \
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /home/ubuntu/cs-qa-platform-prod
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          test -f backend/.env.prod
          docker compose --env-file backend/.env.prod -f deploy/docker-compose.yml config >/dev/null
          docker compose --env-file backend/.env.prod -f deploy/docker-compose.yml build frontend backend
          docker compose --env-file backend/.env.prod -f deploy/docker-compose.yml up -d --remove-orphans
          curl --fail --retry 10 --retry-delay 3 http://127.0.0.1/api/v1/health
          curl --fail --retry 10 --retry-delay 3 http://127.0.0.1/api/v1/ready
          REMOTE
