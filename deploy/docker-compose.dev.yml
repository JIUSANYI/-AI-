services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: csqa
      MYSQL_USER: csqa
      MYSQL_PASSWORD: csqa_dev_password
      MYSQL_ROOT_PASSWORD: root_dev_password
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_dev_data:/data

volumes:
  mysql_dev_data:
  redis_dev_data:

